id: GENIE-COV-002
name: Genie agent active in the audit log but not traced
version: 2
status: experimental
category: coverage
severity: medium

description: |
  The audit log shows Genie acting on a user's behalf in a workspace, but no Genie span
  reached the trace table in that workspace in the same hour. Agent actions carry their
  own user agent (databricks-background-genie ... sid/<session>), so this compares what
  the agent did with what was traced, hour by hour.

  Catches previews that were never turned on, tracing that was switched off, failed
  delivery (Zerobus writes leave no audit trace), and sessions opened before tracing was
  enabled, which stay untraced until the page is reloaded.

  The audit log is regional and the trace table covers one metastore, so deploy one copy
  per region; workspaces elsewhere never appear. The hour still being written is skipped
  because the audit log lags by about ten minutes.

data_sources:
  - unified_trace_table
  - system.access.audit

sql: |
  WITH agent_activity AS (
    SELECT
      CAST(workspace_id AS STRING) AS workspace_id,
      date_trunc('HOUR', event_time) AS hour,
      COUNT(DISTINCT regexp_extract(user_agent, 'sid/([0-9a-f]+)', 1)) AS agent_sessions,
      COUNT(*) AS agent_events,
      MIN(event_time) AS first_seen,
      MAX(event_time) AS last_seen
    FROM {audit_table}
    WHERE event_time >= current_timestamp() - INTERVAL {lookback}
      AND event_time < date_trunc('HOUR', current_timestamp())
      AND user_agent LIKE 'databricks-background-genie%'
      AND workspace_id <> 0
    GROUP BY 1, 2
  ),
  traced AS (
    SELECT DISTINCT
      CAST(attributes:['workspace_id'] AS STRING) AS workspace_id,
      date_trunc('HOUR', time) AS hour
    FROM {trace_table}
    WHERE service_name IN ({genie_services})
      AND time >= current_timestamp() - INTERVAL {lookback}
  )
  SELECT a.workspace_id, a.hour, a.agent_sessions, a.agent_events, a.first_seen, a.last_seen
  FROM agent_activity a
  LEFT ANTI JOIN traced t ON a.workspace_id = t.workspace_id AND a.hour = t.hour

parameters:
  lookback: 1 DAY

false_positive_notes: |
  - Workspaces where Genie tracing is deliberately off (record as a suppression)
  - An hour with agent activity only from Genie features that are not traced
  - Partly traced hours are not reported: one traced session hides an untraced one

tags:
  - coverage
  - genie-code
