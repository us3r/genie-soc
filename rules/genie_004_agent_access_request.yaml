id: GENIE-004
name: Genie prepares an access request on the user's behalf
version: 1
status: experimental
category: detection
severity: low

description: |
  Genie hit data the user cannot read and offered to request access for them. Genie One
  calls the request_uc_asset_access tool without running the query; Genie Code runs the
  query, gets PERMISSION_DENIED and asks whether to file a request (an askUserQuestions
  call whose answer id starts with genie-code-rfa:). The request that reaches the data
  owner carries a justification written by the agent, not by the user.

  One request is normal. Several in a session, or requests for sensitive tables, mean the
  agent is turning "I can't see this" into "please let me see this" at scale, whether the
  user or an injected instruction is driving it.

frameworks:
  owasp_llm:
    - LLM06:2025 Excessive Agency

data_sources:
  - unified_trace_table

sql: |
  WITH requests AS (
    SELECT
      time,
      trace_id,
      service_name,
      attributes:['enduser.id']::string AS user_id,
      CAST(attributes:['workspace_id'] AS STRING) AS workspace_id,
      get_json_object(attributes:['gen_ai.tool.call.arguments']::string, '$.securable_full_name') AS securable
    FROM {trace_table}
    WHERE service_name IN ({genie_services})
      AND time >= current_timestamp() - INTERVAL {lookback}
      AND (
        attributes:['gen_ai.tool.name']::string = 'request_uc_asset_access'
        OR (attributes:['gen_ai.tool.name']::string = 'askUserQuestions'
          AND attributes:['gen_ai.tool.call.result']::string LIKE '%genie-code-rfa:%')
      )
  )
  SELECT
    user_id,
    workspace_id,
    COUNT(*) AS access_requests,
    COUNT(DISTINCT trace_id) AS turns,
    array_compact(collect_set(securable)) AS securables,
    MIN(time) AS first_seen,
    MAX(time) AS last_seen
  FROM requests
  GROUP BY 1, 2
  HAVING access_requests >= {threshold}

parameters:
  lookback: 1 HOUR
  threshold: 1

false_positive_notes: |
  - New joiners and users onboarding to a new data domain
  - Genie Code names the table only in the question text, so securables lists Genie One requests only

tags:
  - genie-one
  - genie-code
  - access
