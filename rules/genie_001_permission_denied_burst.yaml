id: GENIE-001
name: Genie Code permission-denied burst
version: 1
status: experimental
category: detection
severity: medium

description: |
  A user's Genie Code session hits PERMISSION_DENIED on tool calls repeatedly: the agent
  is being asked to reach data or actions the user is not entitled to. One denial is
  normal; a burst is probing, whether by the user or by an injected instruction.

# MITRE ATLAS 2026.10, MITRE ATT&CK v20.1, OWASP Top 10 for LLM Applications 2025
frameworks:
  owasp_llm:
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0053 AI Agent Tool Invocation
    - AML.T0085 Data from AI Services
  mitre_attack:
    - T1213 Data from Information Repositories

data_sources:
  - unified_trace_table

sql: |
  WITH denied AS (
    SELECT
      trace_id,
      time,
      attributes:['enduser.id']::string AS user_id,
      CAST(attributes:['workspace_id'] AS STRING) AS workspace_id
    FROM {trace_table}
    WHERE service_name = 'genie-code-agent'
      AND name LIKE 'execute_tool %'
      AND attributes:['databricks.genie_code.tool.outcome']::string = 'PERMISSION_DENIED'
      AND time >= current_timestamp() - INTERVAL {lookback}
  ),
  roots AS (
    SELECT trace_id, attributes:['gen_ai.conversation.id']::string AS conversation_id
    FROM {trace_table}
    WHERE service_name IN ({genie_services})
      AND name LIKE 'invoke_agent %'
      AND time >= current_timestamp() - INTERVAL {lookback} - INTERVAL 1 DAY
  )
  SELECT
    d.user_id,
    d.workspace_id,
    COUNT(*) AS denied_calls,
    COUNT(DISTINCT d.trace_id) AS turns,
    array_sort(collect_set(coalesce(r.conversation_id, d.trace_id))) AS conversation_ids,
    MIN(d.time) AS first_seen,
    MAX(d.time) AS last_seen,
    date_trunc('DAY', MAX(d.time)) AS day
  FROM denied d
  LEFT JOIN roots r ON r.trace_id = d.trace_id
  GROUP BY 1, 2
  HAVING denied_calls >= {threshold}

finding_key:
  - user_id
  - workspace_id
  - day

parameters:
  lookback: 1 HOUR
  threshold: 5

false_positive_notes: |
  - New joiners before their access requests are approved
  - Users exploring a newly shared catalog with partial grants

tags:
  - genie-code
  - access
