bundle:
  name: genie-soc

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog for genie-soc tables (findings, suppressions).
    default: unity_gateway
  schema:
    description: Schema for genie-soc tables.
    default: genie_soc
  trace_table:
    description: Fully qualified name of the Unity Gateway unified trace table.
    default: unity_gateway.unified_tracing.unity_gateway_otel_spans
  warehouse_id:
    description: SQL warehouse that evaluates the alerts.
    lookup:
      warehouse: Serverless Starter Warehouse
  alert_email:
    description: Who receives alert notifications.
    default: ${workspace.current_user.userName}
  alert_lookback_hours:
    description: >
      How many hours of open findings each notification lists. The alert only triggers when the
      latest run produced a new finding; older rows are context.
    default: "24"
  workspace_url:
    description: >
      Base URL of the workspace, for the table links in notifications. workspace.host is empty
      when the host comes only from a CLI profile; then set it with --var or a local override.
    default: ${workspace.host}

# One target per metastore (region). Targets carry no host or profile: pass --profile.
targets:
  dev:
    default: true
    mode: development
