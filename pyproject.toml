[project]
name = "genie-soc"
version = "0.1.0"
description = "SOC layer for Databricks Genie on the Unity Gateway unified trace table"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genie_soc"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
